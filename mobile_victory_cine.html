<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victory Cine Mobile</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.hero{height:100vh;position:relative;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .overlay{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.hero-content{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center}
.logo{width:180px}
.floating-lang,.floating-social{position:fixed;top:15px;z-index:9999;display:flex;gap:8px}
.floating-lang{right:15px}.floating-social{left:15px}
.floating-lang button,.floating-social a{background:rgba(0,0,0,.6);color:#fff;border:1px solid #444;padding:8px 10px;text-decoration:none}
section{padding:30px}
img.poster{width:100%;border-radius:10px}
.film{margin-bottom:40px}
input,textarea,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
</style>
</head>
<body>
<div class="floating-social">
<a href="https://www.instagram.com/victorycine" target="_blank">IG</a>
<a href="https://www.youtube.com/@VICTORYCine_" target="_blank">YT</a>
<a href="#">TT</a>
</div>
<div class="floating-lang">
<button onclick="changeLanguage('es')">ESP</button>
<button onclick="changeLanguage('en')">ENG</button>
</div>

<header class="hero">
<video autoplay muted loop playsinline><source src="videos/inicio.webm"></video>
<div class="overlay"></div>
<div class="hero-content"><img src="logo.png" class="logo"></div>
</header>

<section><h2 id="aboutTitle">Nosotros</h2><p id="aboutText">VICTORY Cine nace en 2005...</p></section>

<section>
<h2 id="filmsTitle">Films</h2>
<div class="film"><img class="poster" src="benjamin.png"><h3>Benjamín</h3></div>
<div class="film"><img class="poster" src="warriors.png"><h3>Warriors</h3></div>
<div class="film"><img class="poster" src="nohuiras.png"><h3>No Huirás</h3></div>
<div class="film"><img class="poster" src="tiempodejusticia.png"><h3>Tiempo de Justicia</h3></div>
</section>

<section>
<h2 id="contactTitle">Contacto</h2>
<form action="https://formspree.io/f/xzdqronj" method="POST">
<input id="nameInput" name="name" placeholder="Nombre">
<input id="emailInput" name="email" placeholder="Email">
<textarea id="messageInput" name="message" placeholder="Mensaje"></textarea>
<button id="sendButton">ENVIAR MENSAJE</button>
</form>
</section>

<script>
const t={
es:{about:"VICTORY Cine nace en 2005...",aboutTitle:"Nosotros",films:"Films",contact:"Contacto",name:"Nombre",message:"Mensaje",send:"ENVIAR MENSAJE"},
en:{about:"VICTORY Cine was founded in 2005...",aboutTitle:"About",films:"Films",contact:"Contact",name:"Name",message:"Message",send:"SEND MESSAGE"}
};
function changeLanguage(l){
document.getElementById('aboutTitle').textContent=t[l].aboutTitle;
document.getElementById('aboutText').textContent=t[l].about;
document.getElementById('filmsTitle').textContent=t[l].films;
document.getElementById('contactTitle').textContent=t[l].contact;
document.getElementById('nameInput').placeholder=t[l].name;
document.getElementById('messageInput').placeholder=t[l].message;
document.getElementById('sendButton').textContent=t[l].send;
}
changeLanguage('es');
</script>
</body></html>
